[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gpr-equity-observatory"
version = "0.1.0"
description = "Reproducible economics research project on geopolitical risk and equity markets."
requires-python = ">=3.11"
dependencies = [
    "linearmodels>=6,<8",
    "matplotlib>=3.9,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "plotly>=5.24,<7",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<0.15",
    "streamlit>=1.40,<2",
    "xlrd>=2.0,<3",
    "yfinance>=0.2.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gprobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
