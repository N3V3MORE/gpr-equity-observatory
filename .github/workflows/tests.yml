name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          ruff check .
          pytest --cov=gprobs --cov=app --cov-report=term-missing -q

  monthly-sample-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run monthly sample pipeline
        run: |
          python scripts/run_task.py monthly-sample --min-train-months 24

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base-path: ["", "/gpr-equity-observatory"]
    env:
      NEXT_PUBLIC_BASE_PATH: ${{ matrix.base-path }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --strict-peer-deps

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend data integrity
        working-directory: frontend
        run: npm run test:runtime

      - name: Install the locked browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Software fixtures never enter the manual Pages publication workflow.
      - name: Build synthetic software-test artifact
        working-directory: frontend
        run: npm run build:test

      - name: Test the built artifact at desktop and mobile sizes
        working-directory: frontend
        run: npm run test:browser
